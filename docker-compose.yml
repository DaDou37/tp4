

services:

  # Base de données PostgreSQL
  db:
    image: postgres:16
    container_name: api_db
    environment:
      POSTGRES_DB: api    
      POSTGRES_USER: david
      POSTGRES_PASSWORD: david
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d 
  
  api:
    build: .
    container_name: api
    ports:
      - "3000:3000"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: api
      DB_USER: david
      DB_PASSWORD: david
    depends_on:
      - db

volumes:
  postgres_data:
